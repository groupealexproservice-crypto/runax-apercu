name: Publier l'aperçu RUNAX
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apercu
  cancel-in-progress: true
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstituer le site V8
        run: |
          mkdir /tmp/site && cat _paquet-v8/part-* | base64 -d | tar xz -C /tmp/site
          mkdir -p /tmp/site/claude-v2 && cat _paquet-claude-v2/part-* | base64 -d | tar xz -C /tmp/site/claude-v2
      - name: Correctif Club (aucun jour ni heure)
        run: |
          f=$(find /tmp/site/claude-v2 -name groupes.html)
          for x in $f; do
            sed -i 's#<div><dt>Jour</dt><dd>Mardi</dd></div>##; s#<dt>Heure</dt><dd>Environ 1 h par semaine</dd>#<dt>Durée</dt><dd>Environ 1 h par sortie (footing)</dd>#' "$x"
            ! grep -q '<dd>Mardi</dd>' "$x"
          done
      - name: Publier sur la branche gh-pages
        run: |
          cd /tmp/site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Aperçu RUNAX — publication ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
