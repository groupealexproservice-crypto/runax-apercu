name: Publier l'aperçu RUNAX
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apercu
  cancel-in-progress: true
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstituer les images
        run: |
          if ls _paquet/part-* >/dev/null 2>&1; then cat _paquet/part-* | base64 -d | tar xz; fi
          rm -rf _paquet
      - name: Publier sur la branche gh-pages
        run: |
          mkdir /tmp/site && rsync -a --exclude .git --exclude .github ./ /tmp/site/
          cd /tmp/site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Aperçu RUNAX — publication ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
